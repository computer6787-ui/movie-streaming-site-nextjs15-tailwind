# Render blueprint for Chitralipi (the Next.js movie/series site).
#
# Deploy: push render.yaml plus your source, then in Render choose
# "New +" -> "Blueprint" and point it at this repository.
#
# This is the only deployable service in this repository: the movie/series
# web app. Ad blocking ships as browser-side options (a Tampermonkey
# userscript, a bundled MV3 extension, or uBlock Origin) rather than an
# in-page engine, because the player is a cross-origin iframe that site
# code cannot modify. See docs/ADBLOCK.md.

services:
  - type: web
    name: chitralipi
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    # TMDB rejects requests that arrive without an identifying token, and the
    # site throws a hard error when the key is missing, so fail the build
    # loudly rather than deploying a site that 500s on every page.
    envVars:
      - key: NODE_VERSION
        # Major version only, so Render resolves the latest 22.x LTS. Pinning an
        # exact patch here would fail the build the day that patch is retired.
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_TMDB_API_KEY
        sync: false # set this in the Render dashboard to your TMDB v3 key
